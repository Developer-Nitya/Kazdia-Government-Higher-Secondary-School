<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="শিক্ষা">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#14651f" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="300" height="300" fill="url(#g)"/>
  <rect width="300" height="300" fill="url(#dots)"/>
  <circle cx="190" cy="92" r="72" fill="#d71920" opacity=".15"/>
  <circle cx="92" cy="210" r="66" fill="#14651f" opacity=".14"/>
  <rect x="70" y="72" width="160" height="156" rx="22" fill="#fff" opacity=".84"/>
  <text x="50%" y="47%" text-anchor="middle" font-size="42" fill="#14651f" font-family="Arial, sans-serif" font-weight="700">শিক্ষা</text>
  <text x="50%" y="59%" text-anchor="middle" font-size="22" fill="#555" font-family="Arial, sans-serif">প্রতিষ্ঠানের লোগো</text>
</svg>